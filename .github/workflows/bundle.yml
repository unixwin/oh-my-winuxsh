name: Bundle CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python -m py_compile tools/validate_bundle.py tools/package_bundle.py
      - name: Validate manifests and assets
        run: python tools/validate_bundle.py
      - name: Check deterministic package
        run: python tools/package_bundle.py --check
