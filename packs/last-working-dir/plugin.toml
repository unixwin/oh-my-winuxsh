name = "last-working-dir"
bundle = "oh-my-winuxsh"
version = "1.0.0"
kind = "builtin"
api = "winuxsh:plugin@0.1.0"
category = "workflow"
summary = "Last working directory cache and restore command."
default = false
permissions = ["cwd:read", "fs:read:cache", "fs:write:cache"]
required_binaries = []

[exports]
aliases = false
completions = []
prompt_segments = []
hooks = ["startup", "chpwd"]
commands = ["lwd"]
keybindings = []
themes = []
