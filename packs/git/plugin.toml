name = "git"
bundle = "oh-my-winuxsh"
version = "1.0.0"
kind = "builtin"
api = "winuxsh:plugin@0.1.0"
category = "devtools"
summary = "Git aliases, completions, and prompt segments."
default = true
permissions = ["cwd:read", "process:run:git"]
required_binaries = ["git"]

[exports]
aliases = true
completions = ["git"]
prompt_segments = ["git"]
hooks = []
commands = []
keybindings = []
themes = []

[settings]
show_dirty = true
show_ahead_behind = true
