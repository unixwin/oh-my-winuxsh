name = "zoxide"
bundle = "oh-my-winuxsh"
version = "1.0.0"
kind = "builtin"
api = "winuxsh:plugin@0.1.0"
category = "workflow"
summary = "z command shim plus directory tracking."
default = false
permissions = ["cwd:read", "shell:cwd:write", "process:run:zoxide"]
required_binaries = ["zoxide"]

[exports]
aliases = false
completions = []
prompt_segments = []
hooks = ["precmd", "chpwd"]
commands = ["z"]
keybindings = []
themes = []
